<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      color: #333;
    }
    header {
      background-color: #2c3e50;
      color: white;
      padding: 20px;
      text-align: center;
    }
    nav {
      display: flex;
      justify-content: center;
      background-color: #34495e;
    }
    nav a {
      color: white;
      text-decoration: none;
      padding: 14px 20px;
      display: inline-block;
    }
    nav a:hover {
      background-color: #1abc9c;
    }
    main {
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    footer {
      text-align: center;
      padding: 15px;
      background-color: #2c3e50;
      color: white;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome to My Website</h1>
    <p>A simple starter page</p>
  </header>

  <nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>

  <main>
    <h2 id="home">Home</h2>
    <p>This is a basic HTML page with header, navigation, content, and footer sections.</p>

    <h2 id="about">About</h2>
    <p>Add information about yourself or your project here.</p>

    <h2 id="contact">Contact</h2>
    <p>Email: your-email@example.com</p>
  </main>

  <footer>
    <p>&copy; 2026 My Website. All rights reserved.</p>
  </footer>

</body>
</html>
